name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catch dependency/toolchain CVE drift even on weeks with no commits —
    # govulncheck and gosec only see what's true the moment they run, and
    # new CVEs get published against unchanged code (see docs/AUDIT.md §7).
    - cron: '0 6 * * 1' # every Monday, 06:00 UTC

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build
        run: go build ./...

      - name: Test (race detector)
        run: go test -race -count=1 -timeout=5m ./...

      - name: Coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # internal/ui embeds web/'s build output directly into
      # internal/ui/assets (see web/vite.config.ts's outDir) via //go:embed;
      # that directory is gitignored (only a .gitkeep placeholder is
      # tracked), so any Go tooling that type-checks internal/ui — which
      # golangci-lint always does — fails on a fresh checkout with "pattern
      # assets: no matching files found" until this has run once.
      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: golangci-lint
        # Pinned build must be built with a Go toolchain >= go.mod's `go`
        # directive, or it refuses to run at all ("Go language version used
        # to build golangci-lint is lower than the targeted Go version").
        # v2.1.6 (built with go1.23.4) broke exactly this way once go.mod
        # moved to go1.25.12 during the 2026-07-26 audit refresh (see
        # docs/AUDIT.md §7) — bumped to a build compiled with go1.25.12.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run --timeout=5m

  terraform-provider:
    name: Terraform Provider (contrib)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contrib/terraform-provider-tuck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: contrib/terraform-provider-tuck/go.mod
          cache: true
          cache-dependency-path: contrib/terraform-provider-tuck/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # See the matching comment in the lint job — govulncheck/gosec both
      # need to type-check internal/ui, whose //go:embed target is only
      # populated by this build.
      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G104,G704,G706 ./...
