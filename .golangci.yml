version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        - (*net/http.Response).Body.Close
        - (*database/sql.DB).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint

issues:
  exclude-rules:
    - path: '_test\.go'
      linters:
        - errcheck
