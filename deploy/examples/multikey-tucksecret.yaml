# One TuckSecret feeding several keys of a single Secret.
# With the operator's --enforce-namespace-paths every path must start with the
# TuckSecret's namespace ("team-a/") or a prefix granted by the Namespace
# annotation tuck.io/allowed-paths.
apiVersion: tuck.io/v1alpha1
kind: TuckSecret
metadata:
  name: app-db
  namespace: team-a
spec:
  secretName: app-db
  data:
    username: team-a/db/user
    password: team-a/db/pass
  refreshInterval: "5m"
