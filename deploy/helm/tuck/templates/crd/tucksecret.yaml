{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tucksecrets.tuck.io
  labels:
    {{- include "tuck.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # do not delete CRD on helm uninstall
spec:
  group: tuck.io
  scope: Namespaced
  names:
    plural: tucksecrets
    singular: tucksecret
    kind: TuckSecret
    listKind: TuckSecretList
    shortNames:
      - ts
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [secretName]
              properties:
                tuckPath:
                  type: string
                  description: >
                    Logical path of the secret inside Tuck
                    (e.g. "db/password"). The operator prepends /v1/secret/.
                    Use together with secretKey for a single key, or use
                    data for several keys.
                secretName:
                  type: string
                  description: >
                    Name of the Kubernetes Secret to create or update. Several
                    TuckSecrets may feed one Secret as long as they own
                    different keys; the operator merges, it never drops keys
                    it does not manage.
                secretKey:
                  type: string
                  description: >
                    Key inside the Kubernetes Secret's data map where
                    the value of tuckPath will be stored.
                data:
                  type: object
                  additionalProperties:
                    type: string
                  description: >
                    Map of Kubernetes Secret key to Tuck path, e.g.
                    {username: "team-a/db/user", password: "team-a/db/pass"}.
                    Can be combined with tuckPath/secretKey. At least one of
                    the two forms is required. When the operator runs with
                    --enforce-namespace-paths every path must lie under
                    "<namespace>/" or a prefix listed in the Namespace
                    annotation tuck.io/allowed-paths.
                tuckServer:
                  type: string
                  description: >
                    Override the operator's default Tuck server address for
                    this resource. Optional.
                kvVersion:
                  type: string
                  enum: ["1", "2"]
                  default: "1"
                  description: >
                    Which secret engine tuckPath/data resolve against: "1"
                    (default, backward compatible) for the unversioned KV
                    engine, or "2" for the versioned KV v2 engine — this is
                    Tuck's default secret/ mount, so most new TuckSecrets
                    should set this to "2".
                refreshInterval:
                  type: string
                  description: >
                    How often to re-fetch the value from Tuck. Accepts any
                    Go duration string (e.g. "5m", "1h"). Default: 5m.
                deletionPolicy:
                  type: string
                  enum: ["Retain", "Delete"]
                  default: Retain
                  description: >
                    Controls what happens to the managed K8s Secret when this
                    TuckSecret is deleted. "Retain" (default) leaves the K8s
                    Secret in place. "Delete" removes it atomically.
                restartTargets:
                  type: array
                  description: >
                    Workloads to bump (same mechanism as "kubectl rollout
                    restart") when this TuckSecret's synced value actually
                    changes -- never on a periodic refresh that finds the
                    same value. Only takes effect when the operator is run
                    with --enable-restart-targets, which requires RBAC
                    (patch on the listed workload kind) beyond the base
                    operator role; see deploy/operator/restart-rbac.yaml.
                  items:
                    type: object
                    required: [kind, name]
                    properties:
                      kind:
                        type: string
                        enum: ["Deployment", "StatefulSet", "DaemonSet"]
                      name:
                        type: string
            status:
              type: object
              properties:
                lastSyncTime:
                  type: string
                  format: date-time
                lastSyncError:
                  type: string
                syncedRevision:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                        description: Condition type (e.g. Synced, Ready).
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Synced
          type: string
          jsonPath: .status.conditions[?(@.type=="Synced")].status
        - name: TuckPath
          type: string
          jsonPath: .spec.tuckPath
        - name: SecretName
          type: string
          jsonPath: .spec.secretName
        - name: LastSynced
          type: string
          jsonPath: .status.lastSyncTime
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
{{- end }}
