{{- if .Values.csi.enabled }}
{{- /* per-key defaults keep `helm upgrade --reuse-values` from older releases working */ -}}
{{- $ka := .Values.csi.kubernetesAuth | default dict }}
{{- $kaEnabled := true }}
{{- if hasKey $ka "enabled" }}{{ $kaEnabled = $ka.enabled }}{{ end }}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: secrets.tuck.io
spec:
  attachRequired: false
  podInfoOnMount: false
  volumeLifecycleModes:
    - Ephemeral
  {{- if $kaEnabled }}
  # Kubelet hands each pod's ServiceAccount token to the driver and re-delivers
  # a fresh one before it expires, so volumes with tuck.io/auth=kubernetes log
  # in to Tuck without a static token.
  requiresRepublish: true
  # Pass the token in the request secrets instead of the volume context, which
  # CSI sidecars and gRPC loggers may print. Needs Kubernetes 1.35+; older API
  # servers ignore the field and the driver falls back to the volume context.
  serviceAccountTokenInSecrets: true
  tokenRequests:
    - audience: {{ $ka.audience | default "" | quote }}
      expirationSeconds: {{ $ka.expirationSeconds | default 3600 }}
  {{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "tuck.fullname" . }}-csi
  namespace: {{ include "tuck.namespace" . }}
  labels:
    {{- include "tuck.labels" . | nindent 4 }}
    app.kubernetes.io/component: csi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tuck.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: csi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tuck.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: csi
    spec:
      serviceAccountName: {{ include "tuck.fullname" . }}-csi
      containers:
        - name: tuckcsi
          image: {{ include "tuck.csiImage" . }}
          imagePullPolicy: {{ .Values.csi.image.pullPolicy }}
          args:
            - --endpoint=unix:///csi/csi.sock
            - --node-id=$(NODE_NAME)
            {{- if .Values.server.tls.caConfigMap }}
            - --tuck-ca-file=/etc/tuck/ca/ca.crt
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            {{- toYaml .Values.csi.resources | nindent 12 }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
            {{- if .Values.server.tls.caConfigMap }}
            - name: tuck-ca
              mountPath: /etc/tuck/ca
              readOnly: true
            {{- end }}
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.10.0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ .Values.csi.kubeletRootDir }}/plugins/secrets.tuck.io/csi.sock
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      volumes:
        {{- if .Values.server.tls.caConfigMap }}
        - name: tuck-ca
          configMap:
            name: {{ .Values.server.tls.caConfigMap }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        - name: plugin-dir
          hostPath:
            path: {{ .Values.csi.kubeletRootDir }}/plugins/secrets.tuck.io
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.csi.kubeletRootDir }}/plugins_registry
            type: Directory
        - name: pods-mount-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
      {{- with .Values.csi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.csi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
