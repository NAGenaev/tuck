{{- if .Values.server.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tuck.fullname" . }}-server
  labels:
    {{- include "tuck.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tuck.fullname" . }}-server
  labels:
    {{- include "tuck.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tuck.fullname" . }}-server
subjects:
  - kind: ServiceAccount
    name: {{ include "tuck.fullname" . }}-server
    namespace: {{ include "tuck.namespace" . }}
{{- end }}
