# Default values for the Tuck Helm chart.
# Override with --set or a custom values file.

# -- Namespace to deploy into. Creates the namespace if it doesn't exist.
namespaceOverride: ""

global:
  # -- Container image registry prefix applied to all images.
  imageRegistry: "ghcr.io/nagenaev"
  # -- Image pull secrets applied to all deployments.
  imagePullSecrets: []

# --------------------------------------------------------------------------- #
# Tuck Server
# --------------------------------------------------------------------------- #
server:
  enabled: true
  image:
    repository: tuck
    tag: ""          # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  replicaCount: 1

  # -- Seal type: dev | shamir | transit
  sealType: dev

  # -- Dev seal (INSECURE — development only)
  devSeal:
    keyFile: "/data/tuck-dev-rootkey"

  # -- Shamir seal
  shamirSeal:
    "n": 5   # quoted: bare n is a YAML 1.1 boolean and Helm drops the key
    k: 3
    configFile: "/data/tuck-shamir.json"

  # -- Transit seal (Vault-compatible)
  transitSeal:
    addr: ""
    key: "tuck-seal"
    keyFile: "/data/tuck-transit.enc"
    # tokenSecretName: "tuck-transit-token"  # K8s Secret with key "token"

  # -- Persist data with a PVC. Disable for ephemeral/dev deployments.
  persistence:
    enabled: true
    storageClass: ""      # uses default if empty
    size: 1Gi
    accessMode: ReadWriteOnce

  service:
    type: ClusterIP
    port: 8200

  # -- TLS configuration
  tls:
    enabled: false
    auto: false           # generate self-signed cert
    certSecretName: ""    # K8s TLS Secret (tls.crt, tls.key)
    # -- ConfigMap (release namespace, key ca.crt) with the CA that signed the
    # server certificate. When set, the operator and the CSI driver pin Tuck
    # server verification to it (needed for a private/corporate CA).
    caConfigMap: ""

  # -- OpenTelemetry OTLP HTTP endpoint. Empty = disabled.
  otelEndpoint: ""

  # -- Raft HA cluster settings. Needs an odd replicaCount >= 3, persistence, and
  # sealType transit (auto-unseal; the wrapped root key is replicated to every
  # node) or shamir (each pod must be unsealed). The sealType=dev key is local
  # to a pod, so it is rejected. The Service routes to the leader only (pods
  # label themselves tuck.io/leader). The member list is fixed at install:
  # resize the cluster with the join/remove API, not by changing replicaCount.
  cluster:
    enabled: false
    bindAddr: "0.0.0.0:8201"
    dir: "/data/tuck-raft"
    # -- Mutual TLS for Raft RPC (port 8201). Without it Raft traffic is plain
    # TCP inside the cluster network. secretName points to a Secret with
    # tls.crt, tls.key and ca.crt (cert-manager's output format). The one
    # certificate is shared by all pods, so it needs the SAN
    # *.<fullname>-server-headless.<namespace>.svc
    # and both serverAuth and clientAuth extended key usages.
    tls:
      secretName: ""
      # -- Optional: expected peer certificate name. Empty verifies the chain only.
      serverName: ""

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # -- Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532

  # -- Container security context
  securityContext:
    readOnlyRootFilesystem: false  # server writes to /data
    allowPrivilegeEscalation: false

  livenessProbe:
    httpGet:
      path: /v1/health
      port: 8200
    initialDelaySeconds: 10
    periodSeconds: 15

  rbac:
    # -- Grant the server's ServiceAccount cluster-wide permission to create
    # TokenReviews. Required for the Kubernetes auth method (server verifies
    # pod ServiceAccount tokens via the TokenReview API). Disable only if
    # Kubernetes auth is not used.
    create: true
    # -- Let the server list TuckSecret resources and Namespace annotations so the
    # UI can show them (read-only, sync status only, never Secret values). Needs
    # operator.enabled. Disable to keep the server off the Kubernetes API beyond
    # TokenReview.
    viewTuckSecrets: true

  readinessProbe:
    httpGet:
      path: /v1/sys/ready
      port: 8200
    initialDelaySeconds: 5
    periodSeconds: 5

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # -- Extra environment variables injected into the server pod.
  extraEnv: []
  # - name: TUCK_TRANSIT_TOKEN
  #   valueFrom:
  #     secretKeyRef:
  #       name: tuck-transit-token
  #       key: token

# --------------------------------------------------------------------------- #
# Tuck Operator
# --------------------------------------------------------------------------- #
operator:
  enabled: true
  image:
    repository: tuck-operator
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2   # 2 replicas with leader election

  # -- Namespace(s) to watch. Empty watches all namespaces.
  watchNamespace: ""

  # -- Tuck server address. Defaults to the in-cluster service.
  tuckAddr: ""  # auto-computed from server.service if empty

  # -- The operator logs in to Tuck with its own ServiceAccount (Kubernetes auth);
  # no static token is used. Create a Tuck role for <release>-operator first.
  # -- Tuck cluster entry for this operator (multi-cluster Tuck; empty = default).
  tuckCluster: ""

  leaderElect: true

  # -- Restrict every TuckSecret to Tuck paths under "<its namespace>/" plus the
  # prefixes listed in the Namespace annotation tuck.io/allowed-paths. The
  # operator uses one Tuck identity for all namespaces, so without this any
  # team that can create a TuckSecret can read every path the operator's policy
  # allows. Enable it for multi-team clusters. Adds `get namespaces` to the
  # operator ClusterRole.
  enforceNamespacePaths: false

  # -- Act on spec.restartTargets (rolling restart when a synced value really
  # changes). Adds patch on Deployments/StatefulSets/DaemonSets, bound with the
  # same scope as Secrets below.
  enableRestartTargets: false

  rbac:
    # -- "cluster": the operator may write Secrets (and restart workloads) in
    # every namespace. "namespaces": only in the listed ones, via per-namespace
    # RoleBindings -- recommended for multi-team clusters. TuckSecrets in other
    # namespaces are then reported as errors instead of being synced.
    scope: cluster
    # -- Team namespaces for scope=namespaces.
    namespaces: []

  # -- Namespace for the leader-election Lease object. Empty defaults to the
  # release namespace (the same namespace the operator itself runs in) — the
  # operator's own --leader-namespace flag default ("tuck-system") is only
  # meant for raw kubectl deployments that create that namespace by hand;
  # this chart does not create it, so leaving this empty avoids the operator
  # retrying forever against a namespace that was never created.
  leaderNamespace: ""

  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 32Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532

  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

  nodeSelector: {}
  tolerations: []
  affinity: {}

# --------------------------------------------------------------------------- #
# Webhook Injector
# --------------------------------------------------------------------------- #
injector:
  enabled: false   # opt-in; requires cert-manager

  image:
    repository: tuck-injector
    tag: ""
    pullPolicy: IfNotPresent

  # -- tuck-agent init container image used when no per-pod override is set.
  agentImage: ""  # defaults to tuck-agent:<appVersion>

  # -- Ignore: pods are admitted without the agent if the injector is down (the
  # app then starts without its secrets). Fail: pod creation is blocked instead.
  failurePolicy: Ignore

  replicaCount: 2

  # -- cert-manager Certificate is created automatically when certManager=true.
  certManager:
    enabled: true
    issuerName: "tuck-injector-selfsigned"
    issuerKind: "Issuer"

  service:
    port: 443
    targetPort: 8443

  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 32Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532

  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

  nodeSelector: {}
  tolerations: []
  affinity: {}

# --------------------------------------------------------------------------- #
# CSI Provider (secrets.tuck.io)
# --------------------------------------------------------------------------- #
csi:
  # -- Deploy the CSI DaemonSet. Mounts secrets as files in pod tmpfs without
  # modifying application code. Requires linux/amd64 or linux/arm64 nodes.
  enabled: false

  image:
    repository: tuck-csi
    tag: ""          # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  # -- Path where kubelet stores plugins and pod mounts.
  kubeletRootDir: /var/lib/kubelet

  # Log in to Tuck with the pod's own ServiceAccount token (volumeAttributes
  # tuck.io/auth: kubernetes) instead of a static token from a Secret. Needs
  # Kubernetes 1.22+. Volumes using a static token keep working unchanged.
  kubernetesAuth:
    enabled: true
    # -- Audience of the projected token. Empty = the API server's own
    # audience, which is what Tuck's TokenReview checks against.
    audience: ""
    # -- Lifetime of each projected token (min 600). Kubelet republishes a
    # fresh one before it expires.
    expirationSeconds: 3600

  resources:
    limits:
      cpu: 200m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 16Mi

  nodeSelector: {}
  tolerations: []

# --------------------------------------------------------------------------- #
# CRD installation
# --------------------------------------------------------------------------- #
crds:
  # -- Install the TuckSecret CRD. Set false if managing CRDs separately.
  install: true
