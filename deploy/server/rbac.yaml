apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuck-server
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  # Optional: read-only TuckSecret view in the UI (sync status, never Secret values).
  - apiGroups: ["tuck.io"]
    resources: ["tucksecrets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuck-server
subjects:
  - kind: ServiceAccount
    name: tuck-server
    namespace: tuck
roleRef:
  kind: ClusterRole
  name: tuck-server
  apiGroup: rbac.authorization.k8s.io
